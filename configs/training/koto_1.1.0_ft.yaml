# Koto 1.1.0 — optional shorter alternative: fine-tune 1.0.0 (koto_start) on the
# 1.1.0 mix instead of training from scratch. Lower peak learning rate to limit
# forgetting; the mix already replays all general conversation data.
#   python training/train.py --train-config configs/training/koto_1.1.0_ft.yaml
experiment: koto-1.1.0-ft
init_checkpoint: checkpoints/koto_start/best_model.pt
data_cache_dir: data/processed_1.1.0
learning_rate: 3.0e-4
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 200
max_steps: 5000
batch_size: 32
gradient_accumulation_steps: 1
gradient_clip: 1.0
checkpoint_every: 500
eval_every: 500
log_every: 100
val_examples: 5000
output_dir: checkpoints/koto_1.1.0_ft
save_best: true
overwrite_output_dir: false
early_stopping_patience: 4
max_hours: 3.0
seed: 42
