# Hibari Koto — CONTINUE training from the Start checkpoint (not from scratch).
#   python training/train.py --train-config configs/training/koto_continue.yaml
# Weights come from init_checkpoint. If that file is missing, train.py stops
# with an error; it never silently falls back to random weights.
# Data: data/processed_ft = general replay + curated identity/safety +
# writing help (CoEdIT, ParaDetox, smol-rewrite, polite/email). Rebuild with:
#   python scripts/build_finetune_mix.py --dst data/processed_ft \
#     --replay 30000 --curated-repeats 4 --coedit 12000 --paradetox 6000 --smol-rewrite 5000 --polite-repeats 2
# Each run needs a fresh output_dir (the trainer refuses to overwrite best_model.pt).
init_checkpoint: "checkpoints/koto_start/best_model.pt"
data_cache_dir: "data/processed_ft"
learning_rate: 3.0e-4
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 150
max_steps: 4500
batch_size: 32
gradient_clip: 1.0
checkpoint_every: 500
eval_every: 500
log_every: 100
val_examples: 4000
output_dir: "checkpoints/koto_run1"
save_best: true
overwrite_output_dir: false
early_stopping_patience: 0
max_hours: 2.5
seed: 42
