# Koto 1.3.0 — ALTERNATIVE: continue training the 1.1.0 weights on the 1.3.0 mix
# (keeps 1.1.0's rewriting skill as a starting point; ~1.5 h). Not the default: from-scratch
# (koto_1.3.0.yaml) is the clean comparison. Use one or the other, not both into one directory.
#   python training/train.py --model-config configs/model/koto.yaml --train-config configs/training/koto_1.3.0_ft.yaml
# NOTE: the 1.1.0 weights were trained with the "Hibari Koto" system prompt; this mix uses the
# 1.2+ "Koto" prompt, so 5,000 steps also re-teach the identity.
experiment: koto-1.3.0-ft
model_config: configs/model/koto.yaml   # 6.16M (continues the 1.1.0 weights)
model_version: 1.3.0
init_checkpoint: checkpoints/koto_1.1.0/best_model.pt
data_cache_dir: data/processed_1.3.0
learning_rate: 3.0e-4
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 200
max_steps: 5000
batch_size: 32
gradient_accumulation_steps: 1
gradient_clip: 1.0
checkpoint_every: 500
eval_every: 500
log_every: 100
val_examples: 5000
output_dir: checkpoints/koto_1.3.0_ft
save_best: true
overwrite_output_dir: false
early_stopping_patience: 4
max_hours: 3.0
seed: 42
