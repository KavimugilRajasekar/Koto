# Koto 1.1.0 — FULL training run from scratch (random init, CPU).
# Data:   python scripts/build_mix.py --config configs/data/koto_1.1.0.yaml
# Train:  python training/train.py --train-config configs/training/koto_1.1.0.yaml
# Same architecture and recipe as the 1.0.0 (koto_start / v4) full run; the only
# intended change is the data. ~110k training examples at batch 32 is about
# 3.5 epochs in 12k steps. Early stopping keeps the best validation checkpoint.
# The trainer refuses to overwrite an existing best_model.pt in output_dir.
experiment: koto-1.1.0
data_cache_dir: data/processed_1.1.0
learning_rate: 1.0e-3
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 500
max_steps: 12000
batch_size: 32
gradient_accumulation_steps: 1
gradient_clip: 1.0
checkpoint_every: 1000
eval_every: 1000
log_every: 100
val_examples: 5000
output_dir: checkpoints/koto_1.1.0
save_best: true
overwrite_output_dir: false
early_stopping_patience: 4
max_hours: 6.0
seed: 42
