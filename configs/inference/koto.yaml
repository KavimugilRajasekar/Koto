# Hibari Koto — Inference Configuration (defaults used by scripts/generate.py,
# the release Modelfile and the "sampled" evaluation run)
model_checkpoint: "hibari/models/checkpoints/koto_start/best_model.pt"
tokenizer_dir: "hibari/models/tokenizer"
max_new_tokens: 80
temperature: 0.5      # 0 = greedy / deterministic
top_k: 25
top_p: 0.85
repetition_penalty: 1.15
device: "cpu"
