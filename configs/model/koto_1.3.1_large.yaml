# Koto 1.3.1 — the 1.3.0 "large" architecture (29,368,832 parameters, unchanged) with residual dropout.
# Same architecture family (pre-RMSNorm, RoPE, SwiGLU, tied embeddings), same 4,096-token
# tokenizer and 256-token context, so the 1.3.0 data and the GGUF / Ollama path work unchanged.
# Checkpoints of this size are not interchangeable with the 6.16M configs/model/koto.yaml.
model_name: "Hibari-Koto"
vocab_size: 4096
max_seq_len: 256
d_model: 512          # 1.x: 256
n_layers: 8           # 1.x: 6
n_heads: 8            # head_dim 64 (1.x: 32)
d_ff: 1536            # 3 x d_model, as in 1.x
norm_eps: 1.0e-5
dropout: 0.0          # attention weights (as 1.3.0)
resid_dropout: 0.1    # NEW (engine 0.4.1): 1.3.0 reached train 1.59 vs eval 2.87 loss; no parameters, GGUF unaffected
tie_embeddings: true
rope_theta: 10000.0
