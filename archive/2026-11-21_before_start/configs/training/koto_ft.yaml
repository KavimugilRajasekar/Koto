# Hibari Koto — v3 fine-tune (continues from koto_v2/best_model.pt)
# Data: hibari/data/processed_ft (built by scripts/build_finetune_mix.py):
# 30k general replay + expanded curated identity / hostility / safety set.
learning_rate: 3.0e-4
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 100
max_steps: 2500
batch_size: 32
gradient_clip: 1.0
checkpoint_every: 500
eval_every: 500
log_every: 100
val_examples: 4000
output_dir: "hibari/models/checkpoints/koto_v3"
save_best: true
overwrite_output_dir: false
early_stopping_patience: 0
max_hours: 1.5
seed: 42
