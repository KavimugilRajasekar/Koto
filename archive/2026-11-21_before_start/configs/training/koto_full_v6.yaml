# Hibari Koto — Training Configuration (v2 retrain from scratch, CPU)
# Original v1 config was: lr 5e-4, warmup 150, max_steps 1500, batch 16
# (~0.6 epoch; val ppl ~92). See Docs/07_TRAINING_PIPELINE.md.
learning_rate: 1.0e-3
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 500
max_steps: 12000
batch_size: 32
gradient_clip: 1.0
checkpoint_every: 1000
eval_every: 1000
log_every: 100
val_examples: 4000
output_dir: "hibari/models/checkpoints/koto_v6"
save_best: true
overwrite_output_dir: false
early_stopping_patience: 4
max_hours: 5.0
seed: 42
