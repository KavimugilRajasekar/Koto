# Hibari Koto — v5 fine-tune (continues from koto_v4/best_model.pt)
# Data: hibari/data/processed_v5 (scripts/build_finetune_mix.py):
#   30k general + 12k CoEdIT + 6k ParaDetox + smol-rewrite (fits 256 ctx) + curated x4 + polite/email x2
#   python hibari/scripts/build_finetune_mix.py --dst hibari/data/processed_v5 \
#     --replay 30000 --curated-repeats 4 --coedit 12000 --paradetox 6000 --smol-rewrite 5000 --polite-repeats 2
learning_rate: 3.0e-4
min_lr_ratio: 0.1
weight_decay: 0.1
warmup_steps: 150
max_steps: 4500
batch_size: 32
gradient_clip: 1.0
checkpoint_every: 500
eval_every: 500
log_every: 100
val_examples: 4000
output_dir: "hibari/models/checkpoints/koto_v5"
save_best: true
overwrite_output_dir: false
early_stopping_patience: 0
max_hours: 2.5
seed: 42
